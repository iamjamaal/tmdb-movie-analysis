name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "17"

jobs:
  # =========================================================================
  # Lint & Style
  # =========================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length 120 \
            --exclude __pycache__,.venv \
            --count --statistics \
            --ignore E501,W503,W504,E402,E126,E127,E128,E131,E226,E271,E303,E502,E712,E741,W391,F401,F541,F811,F841

      - name: Check formatting with black
        run: black --check --line-length 120 src/ tests/ || true

      - name: Check import sorting
        run: isort --check-only --profile black src/ tests/ || true

  # =========================================================================
  # Unit Tests
  # =========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html

      - name: Run unit tests
        env:
          TMDB_API_KEY: test_api_key_for_ci
          ENVIRONMENT: testing
          LOG_LEVEL: ERROR
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          mkdir -p reports
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            --junitxml=reports/unit-test-results.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/

  
  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run integration tests
        env:
          TMDB_API_KEY: test_api_key_for_ci
          ENVIRONMENT: testing
          LOG_LEVEL: ERROR
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          mkdir -p reports
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            --junitxml=reports/integration-test-results.xml

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports

          
  # Build & Push Docker Images (main branch only)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spark image
        run: |
          docker build \
            -f docker/Dockerfile.spark \
            -t tmdb-spark:${{ github.sha }} \
            -t tmdb-spark:latest \
            .

      - name: Build Airflow image
        run: |
          docker build \
            -f docker/Dockerfile.airflow \
            -t tmdb-airflow:${{ github.sha }} \
            -t tmdb-airflow:latest \
            .

      - name: Build Jupyter image
        run: |
          docker build \
            -f docker/Dockerfile.jupyter \
            -t tmdb-jupyter:${{ github.sha }} \
            -t tmdb-jupyter:latest \
            .

      - name: Verify images
        run: docker images | grep tmdb

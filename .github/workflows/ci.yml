name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  JAVA_VERSION: "11"
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

jobs:
  # =========================================================================
  # Lint & Style
  # =========================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length 120 \
            --exclude __pycache__,.venv \
            --count --statistics \
            --ignore E501,W503,E402

      - name: Check formatting with black
        run: black --check --line-length 120 src/ tests/ || true

      - name: Check import sorting
        run: isort --check-only --profile black src/ tests/ || true

  # =========================================================================
  # Unit Tests
  # =========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html

      - name: Run unit tests
        env:
          TMDB_API_KEY: test_api_key_for_ci
          ENVIRONMENT: testing
          LOG_LEVEL: ERROR
        run: |
          python -m pytest tests/unit/ \
            -v \
            -m "unit or not integration" \
            --tb=short \
            --junitxml=reports/unit-test-results.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage-html/

  # =========================================================================
  # Integration Tests
  # =========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run integration tests
        env:
          TMDB_API_KEY: test_api_key_for_ci
          ENVIRONMENT: testing
          LOG_LEVEL: ERROR
        run: |
          python -m pytest tests/integration/ \
            -v \
            -m "integration or not unit" \
            --tb=short \
            --junitxml=reports/integration-test-results.xml

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports/

  # =========================================================================
  # Build Docker Images (on main only)
  # =========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spark image
        run: |
          docker build \
            -f docker/Dockerfile.spark \
            -t tmdb-spark:${{ github.sha }} \
            .

      - name: Build Airflow image
        run: |
          docker build \
            -f docker/Dockerfile.airflow \
            -t tmdb-airflow:${{ github.sha }} \
            .

      - name: Build Jupyter image
        run: |
          docker build \
            -f docker/Dockerfile.jupyter \
            -t tmdb-jupyter:${{ github.sha }} \
            .

      - name: Verify images
        run: |
          docker images | grep tmdb

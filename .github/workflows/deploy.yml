name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: "3.11"

jobs:

  # Validate deployment readiness
  validate:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: |
          cd docker
          docker compose config --quiet
          echo "Docker Compose configuration is valid."

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "${{ secrets.TMDB_API_KEY }}" ] && missing+=("TMDB_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: Check Dockerfile syntax
        run: |
          for f in docker/Dockerfile.*; do
            echo "Checking $f ..."
            docker build --check -f "$f" . 2>/dev/null || echo "  (--check not supported, skipping)"
          done

  
  # Deploy to staging / production
  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for deployment
        run: |
          cat > .env << 'EOF'
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          POSTGRES_USER=airflow
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'airflow' }}
          POSTGRES_DB=airflow
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || 'redis_password' }}
          AIRFLOW__CORE__FERNET_KEY=${{ secrets.AIRFLOW_FERNET_KEY || '' }}
          AIRFLOW_UID=50000
          EOF

      - name: Build & start services
        working-directory: docker
        run: |
          docker compose build --parallel
          docker compose up -d

      - name: Wait for services to be healthy
        working-directory: docker
        run: |
          echo "Waiting for services to start..."
          sleep 30
          docker compose ps
          echo ""
          echo "Checking service health..."
          docker compose ps --format json | python3 -c "
          import json, sys
          services = json.loads(sys.stdin.read())
          if isinstance(services, dict):
              services = [services]
          unhealthy = [s['Name'] for s in services if 'unhealthy' in s.get('Status','').lower()]
          if unhealthy:
              print(f'Unhealthy services: {unhealthy}')
              sys.exit(1)
          print('All services are healthy.')
          "

      - name: Run smoke test
        run: |
          echo "Running smoke test..."
          # Verify Spark Master is reachable
          curl -sf http://localhost:8080 > /dev/null && echo "Spark Master: OK" || echo "Spark Master: UNREACHABLE"
          # Verify Airflow is reachable
          curl -sf http://localhost:8083/health > /dev/null && echo "Airflow: OK" || echo "Airflow: UNREACHABLE"

      - name: Cleanup on failure
        if: failure()
        working-directory: docker
        run: |
          echo "Deployment failed. Collecting logs..."
          docker compose logs --tail=50
          docker compose down
